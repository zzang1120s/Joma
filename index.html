<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>【 Joma & Ufc 】</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body>

  <!-- 1️⃣ 대문 (랜딩) 화면 - 접속 시 첫 화면 -->
  <div id="landingScreen" onclick="goToMain()" class="fixed inset-0 z-50 flex flex-col items-center justify-center cursor-pointer overflow-hidden bg-slate-950">
    <!-- 배경 이미지 -->
    <img id="bgImg" src="banner.jpg" alt="대문 이미지" class="absolute inset-0 w-full h-full object-cover opacity-50 transition-transform duration-700 hover:scale-105">
    
    <!-- 어두운 그라데이션 오버레이 -->
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-slate-950/80"></div>

    <!-- 대문 문구 & 안내 -->
    <div class="relative z-10 text-center px-4 space-y-6 animate-pulse">
      <span class="px-4 py-1.5 bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-full text-xs font-bold tracking-widest uppercase">
        Guild Official Portal
      </span>
      <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight drop-shadow-lg">
        ⚔️ Joma & Ufc ⚔️
      </h1>
      <p class="text-slate-300 text-sm md:text-lg max-w-md mx-auto">
        Click anywhere on the screen to go to the main page
      </p>
      <div class="pt-4">
        <span class="inline-flex items-center gap-2 px-6 py-3 bg-amber-500 text-slate-950 font-bold rounded-full text-sm shadow-xl">
          👉 Enter the main screen
        </span>
      </div>
    </div>
  </div>


  <!-- 2️⃣ 메인 대시보드 화면 (초기에는 숨김 상태) -->
  <div id="mainDashboard" class="hidden p-6 max-w-6xl mx-auto space-y-6">
    
    <!-- 대시보드 상단 헤더 -->
    <div class="flex justify-between items-center border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-amber-400">⚔️ 길드 정산 & 패널티 대시보드</h1>
        <p class="text-sm text-slate-400 mt-1">구글 시트 실시간 연동 현황</p>
      </div>
      <div class="flex gap-2">
        <button onclick="goToLanding()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">
          🖼️ 대문으로
        </button>
        <button onclick="fetchData()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold rounded-lg text-sm transition">
          🔄 새로고침
        </button>
      </div>
    </div>

    <!-- 요약 카운터 카드 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl">
        <span class="text-xs text-slate-400 font-medium">미정산 항목</span>
        <div id="unsettledCount" class="text-2xl font-bold text-amber-400 mt-1">- 건</div>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl">
        <span class="text-xs text-slate-400 font-medium">패널티 대상자</span>
        <div id="penaltyCount" class="text-2xl font-bold text-rose-400 mt-1">- 명</div>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl">
        <span class="text-xs text-slate-400 font-medium">최종 업데이트</span>
        <div id="lastUpdated" class="text-sm font-semibold text-slate-300 mt-2">-</div>
      </div>
    </div>

    <!-- 패널티 명단 섹션 -->
    <div class="bg-slate-800 border border-rose-900/50 rounded-xl p-5">
      <h2 class="text-lg font-bold text-rose-400 mb-3 flex items-center gap-2">
        <span>🚨</span> 패널티 대상자 목록 (~9월 20일 마감)
      </h2>
      <div id="penaltyContainer" class="flex flex-wrap gap-2">
        <span class="text-sm text-slate-500">데이터를 불러오는 중...</span>
      </div>
    </div>

    <!-- 정산 현황 테이블 -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
      <h2 class="text-lg font-bold text-amber-400 mb-4">📋 실시간 출석 및 정산 원장</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left text-slate-300">
          <thead class="text-xs text-slate-400 uppercase bg-slate-900/60 border-b border-slate-700">
            <tr>
              <th class="py-3 px-4">날짜</th>
              <th class="py-3 px-4">보스명</th>
              <th class="py-3 px-4">참여 유저</th>
              <th class="py-3 px-4">수량</th>
              <th class="py-3 px-4">정산 상태</th>
            </tr>
          </thead>
          <tbody id="sheetTableBody" class="divide-y divide-slate-700">
            <tr>
              <td colspan="5" class="py-6 text-center text-slate-500">데이터를 로딩 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // 💡 저장한 대문 이미지 파일명 (깃허브에 올린 파일명과 일치해야 함)
    // 외부 링크를 쓰실 경우 'https://...' 전체 주소를 넣으시면 됩니다.
    const BANNER_IMAGE = 'banner.jpg'; 

    // 구글 시트 ID 설정
    const SHEET_ID = '1Z7HPi4PCCG1ejB-Wtcjqr4FjPvmHpMnFS4xb3WZ-TNs';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    // 이미지 경로 설정
    document.getElementById('bgImg').src = BANNER_IMAGE;

    // 대문 -> 메인 이동 함수
    function goToMain() {
      document.getElementById('landingScreen').classList.add('hidden');
      document.getElementById('mainDashboard').classList.remove('hidden');
      fetchData(); // 메인 진입 시 데이터 로드
    }

    // 메인 -> 대문 이동 함수
    function goToLanding() {
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('landingScreen').classList.remove('hidden');
    }

    // 시트 데이터 수집 함수
    async function fetchData() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            renderData(results.data);
          }
        });
      } catch (error) {
        console.error('시트 데이터 로드 실패:', error);
      }
    }

    // 시트 데이터 출력 함수
    function renderData(data) {
      const tableBody = document.getElementById('sheetTableBody');
      tableBody.innerHTML = '';
      let unsettledTotal = 0;

      data.forEach(row => {
        const date = row['날짜'] || row['일자'] || Object.values(row)[0] || '-';
        const boss = row['보스'] || row['보스이름'] || Object.values(row)[1] || '-';
        const user = row['유저명'] || row['유저'] || Object.values(row)[2] || '-';
        const qty = row['개수'] || row['수량'] || Object.values(row)[3] || '-';
        const status = row['정산상태'] || row['상태'] || '미정산';

        if (status.includes('미정산')) unsettledTotal++;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/50 transition';
        tr.innerHTML = `
          <td class="py-3 px-4 font-mono text-xs text-slate-400">${date}</td>
          <td class="py-3 px-4 font-semibold text-slate-200">${boss}</td>
          <td class="py-3 px-4 text-slate-300">${user}</td>
          <td class="py-3 px-4">${qty}</td>
          <td class="py-3 px-4">
            <span class="px-2 py-1 rounded text-xs font-semibold ${
              status.includes('완료') 
                ? 'bg-emerald-900/60 text-emerald-400 border border-emerald-700' 
                : 'bg-amber-900/60 text-amber-400 border border-amber-700'
            }">
              ${status}
            </span>
          </td>
        `;
        tableBody.appendChild(tr);
      });

      document.getElementById('unsettledCount').innerText = `${unsettledTotal} 건`;
      document.getElementById('lastUpdated').innerText = new Date().toLocaleTimeString('ko-KR');

      renderPenalties(['grok', 'm', 'EJ', 'Rookie', 'Aim', 'Luvsoul']);
    }

    function renderPenalties(penaltyList) {
      const container = document.getElementById('penaltyContainer');
      container.innerHTML = '';
      document.getElementById('penaltyCount').innerText = `${penaltyList.length} 명`;

      penaltyList.forEach(name => {
        const badge = document.createElement('span');
        badge.className = 'px-3 py-1 bg-rose-950/80 border border-rose-800 text-rose-300 rounded-full text-xs font-medium';
        badge.innerText = `⚠️ ${name}`;
        container.appendChild(badge);
      });
    }
  </script>
</body>
</html>
